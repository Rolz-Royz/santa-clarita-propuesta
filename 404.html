<title>Page not found | Santa Clarita Quinceañera Shop</title>
<script>
(function () {
  var moved = {"en/":"","en/dresses/":"dresses/","en/dress-rental/":"dress-rental/","en/quince-essentials/":"quince-essentials/","en/gallery/":"gallery/","en/visit/":"visit/","en/book-a-fitting/":"book-a-fitting/","en/faq/":"faq/","vestidos/":"es/vestidos/","renta-de-vestidos/":"es/renta-de-vestidos/","todo-para-tus-quince/":"es/todo-para-tus-quince/","galeria/":"es/galeria/","visitanos/":"es/visitanos/","agenda-tu-cita/":"es/agenda-tu-cita/","preguntas-frecuentes/":"es/preguntas-frecuentes/","propuesta/":"es/propuesta/"};
  var path = location.pathname.replace(/index\.html$/, '');
  if (!/\/$/.test(path)) path += '/';
  // Longest old address that the current path ends with wins.
  var keys = Object.keys(moved).sort(function (a, b) { return b.length - a.length; });
  for (var i = 0; i < keys.length; i++) {
    var k = keys[i];
    if (path.slice(-k.length - 1) === '/' + k) {
      location.replace(path.slice(0, path.length - k.length) + moved[k] + location.search + location.hash);
      return;
    }
  }
  window.SC_HOME = /^\/santa-clarita-propuesta\//.test(path) ? '/santa-clarita-propuesta/' : '/';
})();
</script>

</style>
